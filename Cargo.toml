[package]
name = "sourcecritic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sourcecritic"
path = "src/main.rs"

[[bin]]
name = "export_static"
path = "src/bin/export_static.rs"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
